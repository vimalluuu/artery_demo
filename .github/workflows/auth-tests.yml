name: Authentication and database integration
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vascuai_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: vascuai_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vascuai_test -d vascuai_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q --cov=app
        working-directory: backend
      - run: python -m pytest -q --cov=app
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vascuai_test:ci-only-test-password@localhost:5432/vascuai_auth_test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
        working-directory: frontend-react
      - run: npm test
        working-directory: frontend-react
      - run: npm run build
        working-directory: frontend-react
      - run: npm run lint
        working-directory: frontend-react
      - run: python scripts/test_frontend_contract.py
        working-directory: backend
