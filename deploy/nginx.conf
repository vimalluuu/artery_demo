# Serve the compiled SPA and preserve the backend's /api/v1 and /health paths.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Docker's internal DNS refreshes the API address after container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # 2,000 MiB raw NIfTI plus multipart framing; the API applies per-format limits.
    client_max_body_size 2001m;
    client_body_timeout 120s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;

    # No trailing slash or URI on proxy_pass: do not strip /api or /health.
    location ^~ /api/ {
        proxy_pass $api_upstream;
    }
    location = /health {
        access_log off;
        proxy_pass $api_upstream;
    }
    location = /health/ready {
        access_log off;
        proxy_pass $api_upstream;
    }
    location ^~ /health/ { return 404; }

    # Missing JS assets and backend errors must never become SPA index.html.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
